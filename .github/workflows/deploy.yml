name: Deploy Sakani to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📚 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐘 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql
        
    - name: 📦 Install Backend Dependencies
      run: composer install --no-dev --optimize-autoloader --no-interaction
      working-directory: ./backend

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: 🏗️ Build Frontend
      run: |
        npm ci
        npm run build
      working-directory: ./frontend
      
    - name: 📤 Upload Backend Files
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        source: "backend/*"
        target: "~/domains/sakani.site/public_html/"
        strip_components: 0
        overwrite: true

    - name: 🚀 Deploy Backend to Hostinger
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        timeout: 60s
        command_timeout: 15m
        script: |
          echo "🔍 Starting backend deployment..."
          echo "Current user: $(whoami)"
          echo "Home directory: $HOME"
          
          # Navigate to backend directory
          cd ~/domains/sakani.site/public_html/backend
          echo "📂 Current directory: $(pwd)"
          
          # Install/update composer dependencies
          echo "📦 Installing Composer dependencies..."
          composer install --no-dev --optimize-autoloader --no-interaction --verbose
          
          # Create .env if it doesn't exist
          if [ ! -f .env ]; then
            echo "📝 Creating .env file..."
            cp .env.example .env
            
            # Configure for production
            sed -i "s/APP_ENV=local/APP_ENV=production/" .env
            sed -i "s/APP_DEBUG=true/APP_DEBUG=false/" .env
            sed -i "s|APP_URL=http://localhost|APP_URL=https://api.sakani.site|" .env
            sed -i "s|FRONTEND_URL=.*|FRONTEND_URL=https://sakani.site|" .env
            sed -i "s|CORS_ALLOWED_ORIGINS=.*|CORS_ALLOWED_ORIGINS=https://sakani.site|" .env
            
            # Generate application key
            echo "🔑 Generating application key..."
            php artisan key:generate --force
          else
            echo "✅ .env file already exists"
          fi
          
          # Clear all caches first
          echo "🧹 Clearing all caches..."
          php artisan cache:clear || echo "Cache clear failed, continuing..."
          php artisan config:clear || echo "Config clear failed, continuing..."
          php artisan route:clear || echo "Route clear failed, continuing..."
          php artisan view:clear || echo "View clear failed, continuing..."
          php artisan event:clear || echo "Event clear failed, continuing..."
          
          # Setup database if using SQLite (default for fresh installs)
          echo "🗄️ Setting up database..."
          if grep -q "DB_CONNECTION=sqlite" .env; then
            # Ensure SQLite database file exists
            DB_PATH=$(grep "^DB_DATABASE=" .env | cut -d'=' -f2)
            if [ ! -f "$DB_PATH" ]; then
              echo "📄 Creating SQLite database file..."
              touch "$DB_PATH"
            fi
          fi
          
          # Reset and run migrations
          echo "🗄️ Running database migrations..."
          php artisan migrate:fresh --force --seed || php artisan migrate --force
          
          # Optimize for production
          echo "⚡ Optimizing for production..."
          php artisan config:cache || echo "Config cache failed, skipping..."
          php artisan route:cache || echo "Route cache failed, skipping..."
          php artisan view:cache || echo "View cache failed, skipping..."
          php artisan event:cache || echo "Event cache failed, skipping..."
          
          # Additional Laravel optimizations
          echo "🚀 Additional optimizations..."
          php artisan optimize || echo "Optimize command failed, skipping..."
          
          # Set correct permissions
          echo "🔐 Setting file permissions..."
          chmod -R 755 storage
          chmod -R 755 bootstrap/cache
          chmod -R 755 public
          
          # Test the application
          echo "🧪 Testing Laravel installation..."
          php artisan --version
          
          echo "✅ Backend deployment completed successfully!"

    - name: 📤 Upload Frontend Build
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        source: "frontend/dist/*"
        target: "~/domains/sakani.site/public_html/"
        strip_components: 2
        overwrite: true

    - name: 🧪 Test Backend Health
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        timeout: 30s
        script: |
          cd ~/domains/sakani.site/public_html/backend
          
          echo "🔍 Testing backend health..."
          
          # Test if Laravel is working
          php artisan about || echo "Laravel about command failed"
          
          # Test database connection
          php artisan migrate:status || echo "Database connection test failed"
          
          # Check if key routes are working
          php artisan route:list | grep api || echo "API routes check failed"
          
          echo "🩺 Health check completed"

    - name: 🔧 Configure Domain Routing
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        timeout: 30s
        script: |
          cd ~/domains/sakani.site/public_html/
          
          # Create main .htaccess for domain routing
          echo "# Domain routing for Sakani
          RewriteEngine On
          
          # Force HTTPS
          RewriteCond %{HTTPS} off
          RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
          
          # API subdomain routing (api.sakani.site)
          RewriteCond %{HTTP_HOST} ^api\.
          RewriteRule ^(.*)$ backend/public/$1 [L]
          
          # Main domain - serve frontend files directly
          # Handle React Router - redirect all non-file requests to index.html
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          " > .htaccess
          
          echo "✅ Domain routing configured"

    - name: ✅ Deployment Complete
      run: |
        echo "🎉 Deployment successful!"
        echo "Frontend: https://sakani.site"
        echo "API: https://api.sakani.site"