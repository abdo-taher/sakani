name: Deploy Sakani to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📚 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐘 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql
        
    - name: 📦 Install Backend Dependencies
      run: composer install --no-dev --optimize-autoloader --no-interaction
      working-directory: ./backend

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: 🏗️ Build Frontend
      run: |
        npm ci
        npm run build
      working-directory: ./frontend
      
    - name: 📤 Upload Backend Files
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        source: "backend/*"
        target: "~/domains/sakani.site/public_html/"
        strip_components: 0
        overwrite: true

    - name: 🚀 Deploy Backend to Hostinger
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        timeout: 60s
        command_timeout: 15m
        script: |
          echo "🔍 Starting backend deployment..."
          echo "Current user: $(whoami)"
          echo "Home directory: $HOME"
          
          # Navigate to backend directory
          cd ~/domains/sakani.site/public_html/backend
          echo "📂 Current directory: $(pwd)"
          
          # Install/update composer dependencies
          echo "📦 Installing Composer dependencies..."
          composer install --no-dev --optimize-autoloader --no-interaction --verbose
          
          # Create/update .env for production with SQLite
          if [ ! -f .env ]; then
            echo "📝 Creating .env file from template..."
            cp .env.example .env
          else
            echo "📝 Updating existing .env file..."
          fi
          
          # Configure for production with SQLite (Hostinger compatible)
          sed -i "s/APP_NAME=.*/APP_NAME=Sakani/" .env
          sed -i "s/APP_ENV=.*/APP_ENV=production/" .env
          sed -i "s/APP_DEBUG=.*/APP_DEBUG=false/" .env
          sed -i "s|APP_URL=.*|APP_URL=https://api.sakani.site|" .env
          
          # Set database to SQLite 
          sed -i "s/DB_CONNECTION=.*/DB_CONNECTION=sqlite/" .env
          
          # Comment out MySQL settings to avoid confusion
          sed -i "s/^DB_HOST=.*/#&/" .env
          sed -i "s/^DB_PORT=.*/#&/" .env
          sed -i "s/^DB_USERNAME=.*/#&/" .env
          sed -i "s/^DB_PASSWORD=.*/#&/" .env
          
          # Add other production settings
          sed -i "s/LOG_CHANNEL=.*/LOG_CHANNEL=single/" .env
          sed -i "s/LOG_LEVEL=.*/LOG_LEVEL=error/" .env
          
          # Session and cache settings for database
          sed -i "s/SESSION_DRIVER=.*/SESSION_DRIVER=database/" .env
          sed -i "s/CACHE_STORE=.*/CACHE_STORE=database/" .env
          sed -i "s/QUEUE_CONNECTION=.*/QUEUE_CONNECTION=database/" .env
          
          # Generate application key if not set
          if ! grep -q "^APP_KEY=base64:" .env; then
            echo "🔑 Generating application key..."
            php artisan key:generate --force 2>/dev/null || {
              echo "⚠️ Key generate failed (proc_open), generating manually..."
              # Generate key manually
              KEY=$(php -r "echo base64_encode(random_bytes(32));")
              sed -i "s/APP_KEY=.*/APP_KEY=base64:$KEY/" .env
              echo "✅ Application key generated manually"
            }
          else
            echo "✅ Application key already exists"
          fi
          
          # Clear all caches first
          echo "🧹 Clearing all caches..."
          php artisan cache:clear || echo "Cache clear failed, continuing..."
          php artisan config:clear || echo "Config clear failed, continuing..."
          php artisan route:clear || echo "Route clear failed, continuing..."
          php artisan view:clear || echo "View clear failed, continuing..."
          php artisan event:clear || echo "Event clear failed, continuing..."
          
          # Setup database - Configure SQLite with absolute paths to avoid proc_open issues
          echo "🗄️ Setting up SQLite database..."
          
          # Ensure we're using SQLite for production (Hostinger limitation)
          if ! grep -q "DB_CONNECTION=sqlite" .env; then
            echo "📝 Switching to SQLite for Hostinger compatibility..."
            # Comment out MySQL settings and enable SQLite
            sed -i "s/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/" .env
            sed -i "s/^DB_HOST=.*/#&/" .env
            sed -i "s/^DB_PORT=.*/#&/" .env
            sed -i "s/^DB_USERNAME=.*/#&/" .env
            sed -i "s/^DB_PASSWORD=.*/#&/" .env
          fi
          
          # Set absolute path for SQLite database (required for Hostinger)
          DB_PATH="${PWD}/database/database.sqlite"
          
          # Update .env with absolute database path (remove any duplicate DB_DATABASE lines)
          sed -i "/^DB_DATABASE=/d" .env
          echo "DB_DATABASE=${DB_PATH}" >> .env
          
          # Create database directory if it doesn't exist
          mkdir -p database
          
          # Create database file with proper permissions
          if [ ! -f "$DB_PATH" ]; then
            echo "📄 Creating SQLite database file at: $DB_PATH"
            touch "$DB_PATH"
            chmod 664 "$DB_PATH"
          else
            echo "📄 SQLite database already exists at: $DB_PATH"
          fi
          
          # Verify database file is writable
          if [ -w "$DB_PATH" ]; then
            echo "✅ SQLite database is writable"
          else
            echo "⚠️ SQLite database is not writable - fixing permissions..."
            chmod 664 "$DB_PATH"
          fi
          
          echo "✅ SQLite database configured at: $DB_PATH"
          
          # Create tables using direct SQL to avoid proc_open issues
          echo "🗄️ Creating database tables (avoiding proc_open)..."
          
          # First, try Laravel migrations (may fail due to proc_open)
          php artisan migrate:fresh --force 2>/dev/null || {
            echo "⚠️ Laravel migrate failed (proc_open disabled), using direct SQL approach..."
            
            # Create a comprehensive database structure using raw SQL
            # This is a fallback when artisan commands fail due to proc_open restrictions
            php -r "
            try {
              \$pdo = new PDO('sqlite:${DB_PATH}');
              \$pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
              \$pdo->exec('PRAGMA foreign_keys = ON');
              
              echo 'Creating comprehensive database structure...\n';
              
              // Create migrations table
              \$pdo->exec('CREATE TABLE IF NOT EXISTS migrations (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                migration VARCHAR(255) NOT NULL,
                batch INTEGER NOT NULL
              )');
              
              // Create users table
              \$pdo->exec('CREATE TABLE IF NOT EXISTS users (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                name VARCHAR(255) NOT NULL,
                email VARCHAR(255) UNIQUE NOT NULL,
                email_verified_at TIMESTAMP NULL,
                password VARCHAR(255) NOT NULL,
                remember_token VARCHAR(100) NULL,
                created_at TIMESTAMP NULL,
                updated_at TIMESTAMP NULL
              )');
              
              // Create cache table
              \$pdo->exec('CREATE TABLE IF NOT EXISTS cache (
                key VARCHAR(255) PRIMARY KEY,
                value TEXT NOT NULL,
                expiration INTEGER NOT NULL
              )');
              
              // Create sessions table
              \$pdo->exec('CREATE TABLE IF NOT EXISTS sessions (
                id VARCHAR(255) PRIMARY KEY,
                user_id INTEGER NULL,
                ip_address VARCHAR(45) NULL,
                user_agent TEXT NULL,
                payload TEXT NOT NULL,
                last_activity INTEGER NOT NULL
              )');
              
              // Create jobs table for queue
              \$pdo->exec('CREATE TABLE IF NOT EXISTS jobs (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                queue VARCHAR(255) NOT NULL,
                payload TEXT NOT NULL,
                attempts INTEGER NOT NULL,
                reserved_at INTEGER NULL,
                available_at INTEGER NOT NULL,
                created_at INTEGER NOT NULL
              )');
              
              // Create locations table
              \$pdo->exec('CREATE TABLE IF NOT EXISTS locations (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                name VARCHAR(255) NOT NULL,
                latitude DECIMAL(10,8) NULL,
                longitude DECIMAL(11,8) NULL,
                created_at TIMESTAMP NULL,
                updated_at TIMESTAMP NULL
              )');
              
              // Create categories table
              \$pdo->exec('CREATE TABLE IF NOT EXISTS categories (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                name VARCHAR(255) NOT NULL,
                icon VARCHAR(255) NULL,
                slug VARCHAR(255) NULL,
                created_at TIMESTAMP NULL,
                updated_at TIMESTAMP NULL
              )');
              
              // Create property_types table
              \$pdo->exec('CREATE TABLE IF NOT EXISTS property_types (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                name VARCHAR(255) NOT NULL,
                created_at TIMESTAMP NULL,
                updated_at TIMESTAMP NULL
              )');
              
              // Create amenities table
              \$pdo->exec('CREATE TABLE IF NOT EXISTS amenities (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                name VARCHAR(255) NOT NULL,
                icon VARCHAR(255) NULL,
                created_at TIMESTAMP NULL,
                updated_at TIMESTAMP NULL
              )');
              
              // Create properties table
              \$pdo->exec('CREATE TABLE IF NOT EXISTS properties (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                title VARCHAR(255) NOT NULL,
                description TEXT NOT NULL,
                price DECIMAL(12,2) NOT NULL,
                category_id INTEGER NOT NULL,
                property_type_id INTEGER NOT NULL,
                location_id INTEGER NOT NULL,
                area INTEGER NOT NULL,
                rooms INTEGER NOT NULL,
                bathrooms INTEGER NOT NULL,
                floor INTEGER NULL,
                balconies INTEGER NULL,
                rent_duration VARCHAR(255) NULL,
                video_url VARCHAR(255) NULL,
                video_public_id VARCHAR(255) NULL,
                video_thumbnail_url VARCHAR(255) NULL,
                video_secure_url VARCHAR(255) NULL,
                finishing VARCHAR(255) CHECK(finishing IN (\"super_lux\",\"lux\",\"semi_finished\",\"red_brick\")) NOT NULL,
                furnishing VARCHAR(255) CHECK(furnishing IN (\"furnished\",\"unfurnished\")) NOT NULL,
                status VARCHAR(255) CHECK(status IN (\"available\",\"reserved\",\"sold\",\"rented\")) DEFAULT \"available\",
                featured BOOLEAN DEFAULT 0,
                views INTEGER DEFAULT 0,
                created_at TIMESTAMP NULL,
                updated_at TIMESTAMP NULL,
                FOREIGN KEY (category_id) REFERENCES categories(id) ON DELETE CASCADE,
                FOREIGN KEY (property_type_id) REFERENCES property_types(id) ON DELETE CASCADE,
                FOREIGN KEY (location_id) REFERENCES locations(id) ON DELETE CASCADE
              )');
              
              // Create property_images table
              \$pdo->exec('CREATE TABLE IF NOT EXISTS property_images (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                property_id INTEGER NOT NULL,
                image_url VARCHAR(255) NOT NULL,
                public_id VARCHAR(255) NULL,
                secure_url VARCHAR(255) NULL,
                alt_text VARCHAR(255) NULL,
                created_at TIMESTAMP NULL,
                updated_at TIMESTAMP NULL,
                FOREIGN KEY (property_id) REFERENCES properties(id) ON DELETE CASCADE
              )');
              
              // Create property_amenities table
              \$pdo->exec('CREATE TABLE IF NOT EXISTS property_amenities (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                property_id INTEGER NOT NULL,
                amenity_id INTEGER NOT NULL,
                created_at TIMESTAMP NULL,
                updated_at TIMESTAMP NULL,
                FOREIGN KEY (property_id) REFERENCES properties(id) ON DELETE CASCADE,
                FOREIGN KEY (amenity_id) REFERENCES amenities(id) ON DELETE CASCADE
              )');
              
              // Create reservations table
              \$pdo->exec('CREATE TABLE IF NOT EXISTS reservations (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                property_id INTEGER NOT NULL,
                user_name VARCHAR(255) NOT NULL,
                user_email VARCHAR(255) NOT NULL,
                user_phone VARCHAR(255) NOT NULL,
                message TEXT NULL,
                status VARCHAR(255) CHECK(status IN (\"pending\",\"confirmed\",\"cancelled\",\"completed\")) DEFAULT \"pending\",
                created_at TIMESTAMP NULL,
                updated_at TIMESTAMP NULL,
                FOREIGN KEY (property_id) REFERENCES properties(id) ON DELETE CASCADE
              )');
              
              // Create need_requests table
              \$pdo->exec('CREATE TABLE IF NOT EXISTS need_requests (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                name VARCHAR(255) NOT NULL,
                email VARCHAR(255) NOT NULL,
                phone VARCHAR(255) NOT NULL,
                location_id INTEGER NOT NULL,
                category_id INTEGER NOT NULL,
                property_type_id INTEGER NOT NULL,
                budget_min DECIMAL(12,2) NULL,
                budget_max DECIMAL(12,2) NULL,
                description TEXT NULL,
                status VARCHAR(255) CHECK(status IN (\"pending\",\"in_progress\",\"completed\",\"cancelled\")) DEFAULT \"pending\",
                created_at TIMESTAMP NULL,
                updated_at TIMESTAMP NULL,
                FOREIGN KEY (location_id) REFERENCES locations(id) ON DELETE CASCADE,
                FOREIGN KEY (category_id) REFERENCES categories(id) ON DELETE CASCADE,
                FOREIGN KEY (property_type_id) REFERENCES property_types(id) ON DELETE CASCADE
              )');
              
              // Create contact_messages table
              \$pdo->exec('CREATE TABLE IF NOT EXISTS contact_messages (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                name VARCHAR(255) NOT NULL,
                email VARCHAR(255) NOT NULL,
                subject VARCHAR(255) NOT NULL,
                message TEXT NOT NULL,
                status VARCHAR(255) CHECK(status IN (\"unread\",\"read\",\"replied\")) DEFAULT \"unread\",
                created_at TIMESTAMP NULL,
                updated_at TIMESTAMP NULL
              )');
              
              // Create settings table
              \$pdo->exec('CREATE TABLE IF NOT EXISTS settings (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                key VARCHAR(255) UNIQUE NOT NULL,
                value TEXT NULL,
                created_at TIMESTAMP NULL,
                updated_at TIMESTAMP NULL
              )');
              
              // Create personal_access_tokens table
              \$pdo->exec('CREATE TABLE IF NOT EXISTS personal_access_tokens (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                tokenable_type VARCHAR(255) NOT NULL,
                tokenable_id INTEGER NOT NULL,
                name VARCHAR(255) NOT NULL,
                token VARCHAR(64) UNIQUE NOT NULL,
                abilities TEXT NULL,
                last_used_at TIMESTAMP NULL,
                expires_at TIMESTAMP NULL,
                created_at TIMESTAMP NULL,
                updated_at TIMESTAMP NULL
              )');
              
              // Create user_favorites table
              \$pdo->exec('CREATE TABLE IF NOT EXISTS user_favorites (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                user_id INTEGER NOT NULL,
                property_id INTEGER NOT NULL,
                created_at TIMESTAMP NULL,
                updated_at TIMESTAMP NULL,
                FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
                FOREIGN KEY (property_id) REFERENCES properties(id) ON DELETE CASCADE,
                UNIQUE(user_id, property_id)
              )');
              
              echo 'All database tables created successfully!\n';
              
              // Insert migration records to track what we've created
              \$migrations = [
                '0001_01_01_000000_create_users_table',
                '0001_01_01_000001_create_cache_table', 
                '0001_01_01_000002_create_jobs_table',
                '2026_07_12_170004_create_locations_table',
                '2026_07_12_171037_create_categories_table',
                '2026_07_12_171100_create_property_types_table',
                '2026_07_12_171108_create_amenities_table',
                '2026_07_12_171122_create_properties_table',
                '2026_07_12_171254_create_property_images_table',
                '2026_07_12_171311_create_property_amenities_table',
                '2026_07_12_171322_create_reservations_table',
                '2026_07_12_171333_create_need_requests_table',
                '2026_07_12_171347_create_contact_messages_table',
                '2026_07_12_171400_create_settings_table',
                '2026_07_12_185802_create_personal_access_tokens_table',
                '2026_07_22_193753_create_user_favorites_table'
              ];
              
              foreach (\$migrations as \$index => \$migration) {
                \$pdo->exec(\"INSERT OR IGNORE INTO migrations (migration, batch) VALUES ('{\$migration}', 1)\");
              }
              
              echo 'Migration records added successfully!\n';
              
            } catch (Exception \$e) {
              echo 'Database setup error: ' . \$e->getMessage() . '\n';
              exit(1);
            }
            "
            
            # Try migrations again after basic structure is in place
            php artisan migrate --force 2>/dev/null || echo "Migrations still failing, but basic structure is ready"
          }
          
          echo "✅ Database setup completed"
          
          # Optimize for production (with proc_open workarounds)
          echo "⚡ Optimizing for production (Hostinger compatibility)..."
          
          # Try Laravel optimization commands, but don't fail if proc_open is disabled
          php artisan config:cache 2>/dev/null || {
            echo "⚠️ Config cache failed (proc_open disabled), using manual optimization..."
            # Create config cache manually
            php -r "
            require_once 'bootstrap/app.php';
            \$app = \$app ?? app();
            file_put_contents(
              'bootstrap/cache/config.php',
              '<?php return ' . var_export(\$app->make('config')->all(), true) . ';'
            );
            echo 'Config cached manually\n';
            " 2>/dev/null || echo "Manual config cache also failed"
          }
          
          php artisan route:cache 2>/dev/null || echo "Route cache skipped (proc_open limitation)"
          php artisan view:cache 2>/dev/null || echo "View cache skipped (proc_open limitation)" 
          php artisan event:cache 2>/dev/null || echo "Event cache skipped (proc_open limitation)"
          
          # Try general optimize command
          php artisan optimize 2>/dev/null || echo "General optimize skipped (proc_open limitation)"
          
          # Set correct permissions
          echo "🔐 Setting file permissions..."
          chmod -R 755 storage
          chmod -R 755 bootstrap/cache
          chmod -R 755 public
          
          # Test the application
          echo "🧪 Testing Laravel installation..."
          php artisan --version
          
          echo "✅ Backend deployment completed successfully!"

    - name: 📤 Upload Frontend Build
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        source: "frontend/dist/*"
        target: "~/domains/sakani.site/public_html/"
        strip_components: 2
        overwrite: true

    - name: 🩺 Debug and Fix 500 Errors
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        timeout: 60s
        script: |
          cd ~/domains/sakani.site/public_html/backend
          
          echo "🔍 Debugging 500 errors..."
          
          # Check Laravel logs for errors
          echo "📋 Latest Laravel errors:"
          if [ -f "storage/logs/laravel.log" ]; then
            tail -20 storage/logs/laravel.log || echo "No recent Laravel logs"
          else
            echo "Laravel log file doesn't exist yet"
          fi
          
          # Check if .env file exists and is readable
          echo "🔧 Checking .env file:"
          if [ -f .env ]; then
            echo "✅ .env exists"
            # Check if APP_KEY is set
            if grep -q "^APP_KEY=base64:" .env; then
              echo "✅ APP_KEY is properly set"
            else
              echo "❌ APP_KEY missing or invalid - regenerating..."
              php artisan key:generate --force
            fi
          else
            echo "❌ .env file missing - creating..."
            cp .env.example .env
            php artisan key:generate --force
          fi
          
          # Check database configuration
          echo "🗄️ Testing database connection:"
          php artisan migrate:status || echo "❌ Database connection failed"
          
          # Check if vendor directory exists
          echo "📦 Checking composer dependencies:"
          if [ -d "vendor" ]; then
            echo "✅ Vendor directory exists"
          else
            echo "❌ Vendor missing - reinstalling..."
            composer install --no-dev --optimize-autoloader
          fi
          
          # Check file permissions
          echo "🔐 Fixing file permissions:"
          chmod -R 755 storage
          chmod -R 755 bootstrap/cache
          chmod -R 644 .env
          chown -R $USER:$USER storage bootstrap/cache
          
          # Clear all caches to fix potential cache issues
          echo "🧹 Clearing all caches:"
          php artisan cache:clear
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
          
          # Test if Laravel is responding
          echo "🧪 Testing Laravel installation:"
          php artisan --version || echo "❌ Laravel not responding"
          
          echo "✅ Debugging complete - check logs above for issues"

    - name: 🧪 Test Backend Health
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        timeout: 30s
        script: |
          cd ~/domains/sakani.site/public_html/backend
          
          echo "🔍 Testing backend health..."
          
          # Test if Laravel is working (proc_open compatible)
          echo "🧪 Testing Laravel installation (Hostinger compatible):"
          
          # Try artisan commands but don't fail if proc_open is disabled  
          php artisan about 2>/dev/null || {
            echo "⚠️ Artisan about failed (proc_open disabled)"
            # Test PHP and Laravel bootstrap directly
            php -r "
            try {
              require_once 'bootstrap/app.php';
              echo 'Laravel bootstrap: SUCCESS\n';
              echo 'PHP version: ' . phpversion() . '\n';
            } catch (Exception \$e) {
              echo 'Laravel bootstrap: FAILED - ' . \$e->getMessage() . '\n';
            }
            "
          }
          
          # Check database configuration and connection (avoid proc_open)
          echo "🗄️ Testing database connection (Hostinger compatible):"
          
          # Test database connection using PHP directly (avoiding artisan commands)
          php -r "
          try {
            require_once 'bootstrap/app.php';
            \$app = \$app ?? app();
            \$db = \$app->make('db');
            \$pdo = \$db->connection()->getPdo();
            echo 'Database connection: SUCCESS\n';
            
            // Check if basic tables exist
            \$tables = \$pdo->query('SELECT name FROM sqlite_master WHERE type=\"table\"')->fetchAll();
            echo 'Tables found: ' . count(\$tables) . '\n';
            if (count(\$tables) > 0) {
              echo 'Sample tables: ';
              foreach (array_slice(\$tables, 0, 5) as \$table) {
                echo \$table['name'] . ' ';
              }
              echo '\n';
            }
          } catch (Exception \$e) {
            echo 'Database connection: FAILED - ' . \$e->getMessage() . '\n';
            exit(1);
          }
          " || echo "❌ Database connection test failed"
          
          # Alternative: try migrate:status but don't fail if proc_open is disabled
          php artisan migrate:status 2>/dev/null || echo "⚠️ Migrate status unavailable (proc_open disabled)"
          
          # Check if key routes are working (avoid proc_open)
          php artisan route:list 2>/dev/null | grep api || {
            echo "⚠️ Route list failed (proc_open disabled)"
            # Test routes using direct file check
            if [ -f "routes/api.php" ]; then
              echo "✅ API routes file exists"
              grep -c "Route::" routes/api.php || echo "No routes found in api.php"
            else
              echo "❌ API routes file missing"
            fi
          }
          
          # Check web server error logs
          echo "🚨 Checking web server error logs:"
          if [ -f "/home/$USER/domains/sakani.site/logs/error.log" ]; then
            echo "📋 Recent web server errors:"
            tail -10 "/home/$USER/domains/sakani.site/logs/error.log" || echo "Cannot read error log"
          else
            echo "Web server error log not found at expected location"
          fi
          
          # Test direct PHP execution
          echo "🐘 Testing PHP execution:"
          cd public
          php -r "echo 'PHP is working: ' . phpversion() . PHP_EOL;"
          
          echo "🩺 Health check completed"

    - name: 🔧 Configure Domain Routing
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        timeout: 30s
        script: |
          cd ~/domains/sakani.site/public_html/
          
          # Create main .htaccess for domain routing
          echo "# Domain routing for Sakani
          RewriteEngine On
          
          # Force HTTPS
          RewriteCond %{HTTPS} off
          RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
          
          # API subdomain routing (api.sakani.site)
          RewriteCond %{HTTP_HOST} ^api\.
          RewriteRule ^(.*)$ backend/public/$1 [L]
          
          # Main domain - serve frontend files directly
          # Handle React Router - redirect all non-file requests to index.html
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          " > .htaccess
          
          echo "✅ Domain routing configured"

    - name: ✅ Deployment Complete
      run: |
        echo "🎉 Deployment successful!"
        echo "Frontend: https://sakani.site"
        echo "API: https://api.sakani.site"