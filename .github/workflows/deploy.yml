name: Deploy Sakani to Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📚 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐘 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql
        
    - name: 📦 Install Backend Dependencies
      run: |
        rm -f composer.lock
        composer update --no-interaction --no-audit
      working-directory: ./backend

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: 🏗️ Build Frontend
      run: |
        npm ci
        npm run build
      working-directory: ./frontend
      
    - name: 🚀 Deploy to Server
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        port: ${{ secrets.PORT || 65002 }}
        timeout: 60s
        command_timeout: 15m
        script: |
          echo "🔍 Testing SSH connection..."
          echo "Current user: $(whoami)"
          echo "Home directory: $HOME"
          echo "Current directory: $(pwd)"
          
          # Check if public_html exists
          if [ -d "public_html" ]; then
            echo "✅ public_html directory found"
            cd public_html
          elif [ -d "domains" ]; then
            echo "✅ domains directory found, checking structure..."
            cd domains
            ls -la
            # Try to find your domain folder
            if [ -d "*" ]; then
              cd */public_html 2>/dev/null || cd */
            fi
          else
            echo "📁 Available directories:"
            ls -la
            # Create public_html if it doesn't exist
            mkdir -p public_html
            cd public_html
          fi
          
          echo "📂 Working in: $(pwd)"
          
          # Create sakani directory
          mkdir -p sakani
          cd sakani
          
          # Clone or update repository
          if [ ! -d ".git" ]; then
            echo "🔄 Cloning repository..."
            git clone https://github.com/${{ github.repository }}.git .
          else
            echo "🔄 Updating repository..."
            git fetch origin main
            git reset --hard origin/main
          fi
          
          # Run deployment
          chmod +x deploy.sh
          echo "🚀 Starting deployment..."
          ./deploy.sh

    - name: 📤 Upload Frontend Build
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        port: ${{ secrets.PORT || 22 }}
        source: "frontend/dist/*"
        target: "~/public_html/sakani/frontend/"
        strip_components: 2

    - name: 📧 Notify on Failure
      if: failure()
      run: echo "❌ Deployment failed!"
