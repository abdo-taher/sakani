name: Deploy Sakani to Hostinger

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Build Frontend
      run: |
        npm ci
        npm run build
      working-directory: ./frontend

    - name: Tar Backend Source (no vendor)
      run: |
        tar czf backend-src.tar.gz --exclude='vendor' --exclude='storage/logs' --exclude='storage/framework/cache' --exclude='storage/framework/sessions' --exclude='storage/framework/views' --exclude='.env' --exclude='node_modules' backend/

    - name: Upload Backend Source
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        source: "backend-src.tar.gz"
        target: "~/domains/sakani.site/public_html/"
        timeout: 5m
        command_timeout: 5m

    - name: Deploy & Configure
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
        CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        timeout: 60s
        command_timeout: 15m
        envs: R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_ACCOUNT_ID,R2_BUCKET,R2_ENDPOINT,R2_PUBLIC_URL,CLOUDFLARE_R2_ACCESS_KEY_ID,CLOUDFLARE_R2_SECRET_ACCESS_KEY,CLOUDFLARE_R2_BUCKET,CLOUDFLARE_R2_ENDPOINT,CLOUDFLARE_R2_PUBLIC_URL,CF_ACCOUNT_ID
        script: |
          set -e
          cd ~/domains/sakani.site/public_html

          echo "Extracting backend source..."
          tar xzf backend-src.tar.gz
          rm backend-src.tar.gz

          cd backend

          echo "Installing composer dependencies..."
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress 2>&1

          # Configure .env (preserve existing values)
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          # Safely inject R2 deployment secrets when configured in GitHub.
          # Empty GitHub secrets never overwrite existing Hostinger values.
          set_env_if_provided() {
            ENV_NAME="$1" ENV_VALUE="$2" php -r '
              $name = getenv("ENV_NAME");
              $value = getenv("ENV_VALUE");
              if ($value === false || $value === "") exit(0);
              $file = ".env";
              $lines = file_exists($file) ? file($file, FILE_IGNORE_NEW_LINES) : [];
              $encoded = "\"" . addcslashes($value, "\\\"") . "\"";
              $replacement = $name . "=" . $encoded;
              $found = false;
              foreach ($lines as &$line) {
                if (str_starts_with(trim($line), $name . "=")) {
                  $line = $replacement;
                  $found = true;
                  break;
                }
              }
              unset($line);
              if (!$found) $lines[] = $replacement;
              file_put_contents($file, implode(PHP_EOL, $lines) . PHP_EOL);
            '
          }

          set_env_if_provided R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID"
          set_env_if_provided R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY"
          set_env_if_provided R2_ACCOUNT_ID "$R2_ACCOUNT_ID"
          set_env_if_provided R2_BUCKET "$R2_BUCKET"
          set_env_if_provided R2_ENDPOINT "$R2_ENDPOINT"
          set_env_if_provided R2_PUBLIC_URL "$R2_PUBLIC_URL"
          set_env_if_provided CLOUDFLARE_R2_ACCESS_KEY_ID "$CLOUDFLARE_R2_ACCESS_KEY_ID"
          set_env_if_provided CLOUDFLARE_R2_SECRET_ACCESS_KEY "$CLOUDFLARE_R2_SECRET_ACCESS_KEY"
          set_env_if_provided CLOUDFLARE_R2_BUCKET "$CLOUDFLARE_R2_BUCKET"
          set_env_if_provided CLOUDFLARE_R2_ENDPOINT "$CLOUDFLARE_R2_ENDPOINT"
          set_env_if_provided CLOUDFLARE_R2_PUBLIC_URL "$CLOUDFLARE_R2_PUBLIC_URL"
          set_env_if_provided CF_ACCOUNT_ID "$CF_ACCOUNT_ID"

          sed -i "s/APP_NAME=.*/APP_NAME=Sakani/" .env
          sed -i "s/APP_ENV=.*/APP_ENV=production/" .env
          sed -i "s/APP_DEBUG=.*/APP_DEBUG=false/" .env
          sed -i "s|APP_URL=.*|APP_URL=https://api.sakani.site|" .env
          sed -i "s/LOG_CHANNEL=.*/LOG_CHANNEL=single/" .env
          sed -i "s/LOG_LEVEL=.*/LOG_LEVEL=error/" .env
          sed -i "s/SESSION_DRIVER=.*/SESSION_DRIVER=database/" .env
          sed -i "s/CACHE_STORE=.*/CACHE_STORE=database/" .env
          sed -i "s/QUEUE_CONNECTION=.*/QUEUE_CONNECTION=database/" .env

          # Generate APP_KEY if missing
          if ! grep -q "^APP_KEY=base64:" .env; then
            KEY=$(php -r "echo base64_encode(random_bytes(32));")
            sed -i "s/APP_KEY=.*/APP_KEY=base64:$KEY/" .env
            echo "Generated APP_KEY"
          fi

          # Clear caches
          php artisan cache:clear 2>/dev/null || true
          php artisan config:clear 2>/dev/null || true
          php artisan route:clear 2>/dev/null || true
          php artisan view:clear 2>/dev/null || true
          php artisan event:clear 2>/dev/null || true

          # Stop deployment before users receive upload 500s when R2 secrets are absent.
          php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $kernel = $app->make("Illuminate\\Contracts\\Console\\Kernel");
            $kernel->bootstrap();
            $service = $app->make("App\\Services\\R2MediaService");
            if (!$service->isConfigured()) {
              fwrite(STDERR, "R2 configuration missing: " . implode(", ", $service->missingConfigurationKeys()) . PHP_EOL);
              exit(1);
            }
            echo "R2 configuration present" . PHP_EOL;
          '

          # Run migrations
          echo "Running migrations..."
          php artisan migrate --force 2>/dev/null || echo "Migration warning (continuing)"

          # Permissions
          chmod -R 755 storage bootstrap/cache public

          echo "Backend deployed OK"
          php artisan --version

    - name: Upload Frontend Build
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        source: "frontend/dist/*"
        target: "~/domains/sakani.site/public_html/"
        strip_components: 2
        overwrite: true
        timeout: 5m
        command_timeout: 5m

    - name: Configure .htaccess
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        timeout: 30s
        script: |
          cd ~/domains/sakani.site/public_html

          cat > .htaccess << 'HTACCESS'
          # Sakani Production .htaccess Configuration
          RewriteEngine On

          # Charset Configuration for SEO
          AddDefaultCharset UTF-8

          <IfModule mod_headers.c>
            <FilesMatch "\.(html|htm|php)$">
              Header set Content-Type "text/html; charset=UTF-8"
            </FilesMatch>
            Header set X-Content-Type-Options "nosniff"
            Header set X-Frame-Options "SAMEORIGIN"
            Header set Referrer-Policy "strict-origin-when-cross-origin"
          </IfModule>

          # 1. API Subdomain Handling (Preserve api.sakani.site without redirecting to root)
          RewriteCond %{HTTP_HOST} ^api\.sakani\.site$ [NC]
          RewriteCond %{HTTPS} off
          RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

          RewriteCond %{HTTP_HOST} ^api\.sakani\.site$ [NC]
          RewriteRule ^(.*)$ backend/public/$1 [L]

          # 2. Canonical www -> non-www 301 Direct Redirect (Single hop)
          RewriteCond %{HTTP_HOST} ^www\.sakani\.site$ [NC]
          RewriteRule ^(.*)$ https://sakani.site/$1 [L,R=301]

          # 3. Force HTTPS for non-www domain
          RewriteCond %{HTTPS} off
          RewriteCond %{HTTP_HOST} ^sakani\.site$ [NC]
          RewriteRule ^(.*)$ https://sakani.site/$1 [L,R=301]

          # Caching & Assets
          <IfModule mod_headers.c>
            <FilesMatch "\.(mp4|webm|ogg|mov)$">
              Header set Cache-Control "public, max-age=2592000, immutable"
            </FilesMatch>
            <FilesMatch "\.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
          </IfModule>

          # SPA and Static Pre-rendered Pages Routing
          # If directory with index.html exists (e.g. /rent/index.html), serve it directly
          RewriteCond %{REQUEST_FILENAME} -d
          RewriteCond %{REQUEST_FILENAME}/index.html -f
          RewriteRule ^(.*)$ $1/index.html [L]

          # React Router SPA fallback for dynamic routes
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          HTACCESS

          echo ".htaccess configured"

    - name: Health Check
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        timeout: 30s
        script: |
          cd ~/domains/sakani.site/public_html/backend
          php artisan --version && echo "Laravel OK" || echo "Laravel FAILED"
          ls -la storage/logs/ 2>/dev/null || true

    - name: Deploy Complete
      run: |
        echo "Frontend: https://sakani.site"
        echo "API: https://api.sakani.site"
