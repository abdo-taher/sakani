name: Deploy Sakani to Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📚 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐘 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql
        
    - name: 📦 Install Backend Dependencies
      run: |
        rm -f composer.lock
        composer update --no-interaction --no-audit
      working-directory: ./backend

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: 🏗️ Build Frontend
      run: |
        npm ci
        npm run build
      working-directory: ./frontend
      
    - name: 🚀 Deploy to Server
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT || 22 }}
        script: |
          echo "🔍 Current user: $(whoami)"
          echo "🏠 Home directory: $HOME"
          
          # Navigate to web root
          cd ~/public_html || cd /home/$(whoami)/public_html
          
          # Create sakani directory if it doesn't exist
          if [ ! -d "sakani" ]; then
            mkdir -p sakani
          fi
          
          cd sakani
          
          # Clone or update repository
          if [ ! -d ".git" ]; then
            git clone https://github.com/${{ github.repository }}.git .
          else
            git fetch origin main
            git reset --hard origin/main
          fi
          
          chmod +x deploy.sh
          ./deploy.sh

    - name: 📤 Upload Frontend Build
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT || 22 }}
        source: "frontend/dist/*"
        target: "~/public_html/sakani/frontend/"
        strip_components: 2

    - name: 📧 Notify on Failure
      if: failure()
      run: echo "❌ Deployment failed!"
